name: Frontend Smoke Test

on:
  push:
    branches:
      - main
      - next-phase-maintainability
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Check application JavaScript syntax
        run: node --check app.js

      - name: Run application smoke checks
        run: node scripts/smoke-check.mjs

      - name: Check diff formatting
        run: git diff --check
