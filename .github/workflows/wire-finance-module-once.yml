name: Wire Finance Module Once

on:
  push:
    branches:
      - finance-reporting
    paths:
      - .github/workflows/wire-finance-module-once.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: finance-reporting
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Wire finance module
        run: node scripts/wire-finance-module.mjs

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check finance-reporting.js

      - name: Run smoke checks
        run: node scripts/smoke-check.mjs

      - name: Check formatting
        run: git diff --check

      - name: Commit wiring
        run: |
          if git diff --quiet; then
            echo "No wiring changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Wire finance reporting module into app"
          git push origin HEAD:finance-reporting
