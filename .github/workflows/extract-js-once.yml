name: Extract JavaScript from index

on:
  push:
    branches:
      - next-phase-maintainability
    paths:
      - scripts/extract-js.mjs

permissions:
  contents: write

jobs:
  extract-js:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: next-phase-maintainability
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract application JavaScript
        run: node scripts/extract-js.mjs

      - name: Check application JavaScript syntax
        run: node --check app.js

      - name: Run smoke checks
        run: node scripts/smoke-check.mjs

      - name: Check diff formatting
        run: git diff --check

      - name: Commit extracted JavaScript
        shell: bash
        run: |
          if git diff --quiet -- index.html app.js; then
            echo "No JavaScript extraction changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js
          git commit -m "Refactor: extract app JavaScript from index [skip ci]"
          git push origin HEAD:next-phase-maintainability
