name: Wire Month-End Control Once

on:
  push:
    branches:
      - month-end-finance-control
    paths:
      - .github/workflows/wire-month-end-control-once.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: month-end-finance-control
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Wire month-end control
        run: node scripts/wire-month-end-control.mjs

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check finance-reporting.js
          node --check month-end-control.js

      - name: Run smoke checks
        run: node scripts/smoke-check.mjs

      - name: Check formatting
        run: git diff --check

      - name: Commit wiring
        run: |
          if git diff --quiet; then
            echo "No wiring changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/smoke-check.mjs
          git commit -m "Wire month-end finance control into app"
          git push origin HEAD:month-end-finance-control
