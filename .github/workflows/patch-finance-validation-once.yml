name: Patch Finance Validation Once

on:
  push:
    branches:
      - finance-reporting
    paths:
      - .github/workflows/patch-finance-validation-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: finance-reporting
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Apply validation fixes
        run: node scripts/patch-finance-validation.mjs

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check finance-reporting.js

      - name: Run smoke checks
        run: node scripts/smoke-check.mjs

      - name: Check formatting
        run: git diff --check

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No finance validation changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add finance-reporting.js scripts/smoke-check.mjs
          git commit -m "Fix finance summary quantity and recurring pricing refresh"
          git push origin HEAD:finance-reporting
