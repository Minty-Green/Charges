name: Extract CSS from index

on:
  push:
    branches:
      - next-phase-maintainability
    paths:
      - scripts/extract-css.mjs
      - scripts/smoke-check.mjs

permissions:
  contents: write

jobs:
  extract-css:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: next-phase-maintainability
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract stylesheet
        run: node scripts/extract-css.mjs

      - name: Run smoke checks
        run: node scripts/smoke-check.mjs

      - name: Check diff formatting
        run: git diff --check

      - name: Commit extracted stylesheet
        shell: bash
        run: |
          if git diff --quiet -- index.html styles.css; then
            echo "No CSS extraction changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css
          git commit -m "Refactor: extract app CSS from index [skip ci]"
          git push origin HEAD:next-phase-maintainability
