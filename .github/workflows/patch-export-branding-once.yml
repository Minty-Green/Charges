name: Patch Export Branding Once

on:
  push:
    branches:
      - finance-reporting

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: finance-reporting
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Apply export branding patch
        run: node scripts/patch-export-branding.mjs

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Run smoke checks
        run: node scripts/smoke-check.mjs

      - name: Check formatting
        run: git diff --check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js scripts/smoke-check.mjs
          git commit -m "Fix export company and branch branding [skip ci]"
          git push origin HEAD:finance-reporting
